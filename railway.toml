# Railway configuration for the PRIVATE Django service.
#
# Two services, one per image:
#   Django (this file, Dockerfile.django)                  private, no public domain
#   Bun SSR (deploy/railway.frontend.toml, Dockerfile.frontend)  public
# The frontend service must select deploy/railway.frontend.toml explicitly in its
# settings so the two services never compete for the same auto-detected config.
#
# NOTE: Railway is deprecating config-as-code (railway.toml / railway.json) on
# 2026-12-01. This file keeps the existing service working; a NEW service must be
# configured in the dashboard instead: Dockerfile path Dockerfile.django,
# pre-deploy command `python /app/backend/manage.py migrate --noinput`,
# healthcheck path /up/, restart on failure.
# See https://docs.railway.com/infrastructure-as-code
#
# Service variables to set in the dashboard: SECRET_KEY, DEBUG=false,
# ALLOWED_HOSTS, CSRF_TRUSTED_ORIGINS, DATABASE_URL (reference the Postgres
# service), PROJECT_NAME, SITE_URL. PORT is injected by Railway.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile.django"

[deploy]
# Migrations run once per deploy, before the new container takes traffic.
# The image already has the locked virtualenv on PATH, so no uv at runtime.
preDeployCommand = ["python /app/backend/manage.py migrate --noinput"]
healthcheckPath = "/up/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
numReplicas = 1
