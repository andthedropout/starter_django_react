# Railway configuration for the PUBLIC frontend service (Bun SSR).
#
# Select this file explicitly on the frontend service:
#   Settings > Config-as-code > Railway Config File = deploy/railway.frontend.toml
# The root railway.toml stays with the Django service, so the two services never
# compete for the same auto-detected config.
#
# NOTE: Railway is deprecating config-as-code on 2026-12-01. For a new service,
# set the same values in the dashboard instead: Dockerfile path
# Dockerfile.frontend, healthcheck /up/, restart on failure.
#
# Service variables to set in the dashboard:
#   DJANGO_API_URL  private URL of the Django service, e.g. http://web.railway.internal:8000
#   SITE_URL        public URL of this service, e.g. https://example.com
#   NODE_ENV=production
# PORT is injected by Railway and honoured by the Bun adapter.
#
# No pre-deploy command here: migrations belong to the Django service.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile.frontend"

[deploy]
healthcheckPath = "/up/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
numReplicas = 1
