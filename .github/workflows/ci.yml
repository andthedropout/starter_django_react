name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: starter
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: starter
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U starter -d starter"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DEBUG: 'false'
      SECRET_KEY: ci-only-5cfbdad6c847491c856ec82e5d4348c79a2dbbe85a3449f5
      DATABASE_URL: postgresql://starter:ci-only@127.0.0.1:5432/starter
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: '0.12.15'
          python-version: '3.13'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check backend .github
      - run: uv run ruff format --check backend .github
      - run: uv run python .github/check_backend_boundaries.py
      - run: uv run python backend/manage.py check --deploy --fail-level WARNING
        env:
          # Verify the strict profile without imposing domain-wide HSTS on template users.
          SECURE_HSTS_INCLUDE_SUBDOMAINS: 'true'
          SECURE_HSTS_PRELOAD: 'true'
      - run: uv run python backend/manage.py makemigrations --check --dry-run
      - run: uv run python backend/manage.py test

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      # Start generates route types during the build, before tsc checks them.
      - run: bun run build
      - run: bun run typecheck
      - run: bun run lint

  production:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: Dockerfile.django
          load: true
          tags: starter-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: Dockerfile.frontend
          load: true
          tags: starter-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Boot disposable production stack
        run: |
          docker network create starter-smoke
          docker run -d --name smoke-db --network starter-smoke \
            -e POSTGRES_USER=starter -e POSTGRES_PASSWORD=ci-only -e POSTGRES_DB=starter \
            --health-cmd 'pg_isready -U starter -d starter' \
            --health-interval 2s --health-timeout 3s --health-retries 20 postgres:17-alpine
          for attempt in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' smoke-db)" = healthy ]; then break; fi
            sleep 2
          done
          docker run -d --name smoke-backend --network starter-smoke \
            -e DEBUG=false -e SECRET_KEY=ci-only-5cfbdad6c847491c856ec82e5d4348c79a2dbbe85a3449f5 \
            -e DATABASE_URL=postgresql://starter:ci-only@smoke-db:5432/starter \
            -e ALLOWED_HOSTS=app.example.test,127.0.0.1,localhost \
            -e CSRF_TRUSTED_ORIGINS=https://app.example.test -e TRUST_PROXY_HEADERS=true \
            starter-backend:ci
          docker exec smoke-backend python /app/backend/manage.py migrate --noinput
          docker run -d --name smoke-frontend --network starter-smoke -p 127.0.0.1:19000:3000 \
            -e SITE_URL=https://app.example.test -e DJANGO_API_URL=http://smoke-backend:8000 \
            starter-frontend:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:19000/up/; then break; fi
            sleep 2
          done
      - run: python3 .github/smoke.py
      - name: Container logs on failure
        if: failure()
        run: |
          docker logs smoke-backend || true
          docker logs smoke-frontend || true
      - name: Remove disposable stack
        if: always()
        run: |
          docker rm -f -v smoke-frontend smoke-backend smoke-db || true
          docker network rm starter-smoke || true
